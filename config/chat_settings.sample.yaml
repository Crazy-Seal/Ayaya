chat_models:
- session_id: abcdefgh-ijkl-mnop-qrst-uvwxyz123456
  model_name: gemini-3.1-pro-preview
  openai_api_key: YOUR_API_KEY
  openai_base_url: https://www.dmxapi.cn/v1
  temperature: 0.9
  system_prompt: '提示词(前端会自动组装)'
  tool_permissions:
    local:access_the_internet: allow
    local:apply_patch: deny
    local:control_screen: deny
    local:control_screen_with_vlm: deny
    local:read_file: deny
    local:read_image: deny
    local:run_ps: deny
    local:screenshot: ask
    local:search_diary: allow
    local:search_memory: allow
    local:update_plan: deny
  tool_permissions_schema_version: 1
  context_strategy:
    compression_trigger_tokens_k: 100
    max_screenshots_in_context: 2
    screenshot_ttl_human_messages: 2
  agent_plugins:
    memory:
      enabled: true
      config:
        enable_diary: true
        enable_episodic: true
        enable_semantic: true
        long_term_memory_every_human_messages: 10
  name: AI名字
  feature: 性格特点
  character: AI人设
  address: 对用户称呼
  characteristic: 详细性格特点
  constraint: '发言约束'
